name: Build and test Scan Inbox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Prepare offline assets
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run assets
      - name: Build application
        run: dotnet build --configuration Debug
      - name: Install test browser
        run: npx playwright install chromium
      - name: Browser and integration tests
        run: npm run test:e2e
      - name: Check UI contrast
        run: node tools/check-contrast.mjs
      - name: Publish IIS package
        run: dotnet publish ScanInbox.csproj --configuration Release --runtime win-x64 --self-contained false --output "$env:RUNNER_TEMP\scan-inbox-publish"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scan-inbox-iis-win-x64
          path: ${{ runner.temp }}/scan-inbox-publish/
          if-no-files-found: error
          retention-days: 14
